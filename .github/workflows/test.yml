name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff
        run: |
          ruff check scripts tests tools/*.py tools/gar-mcp/server.py
          ruff format --check scripts tests tools/*.py tools/gar-mcp/server.py

      - name: Check shell and VS Code extension syntax
        run: |
          bash -n tools/forward_sim_ports.sh tools/forward_ec2_ports.sh tools/setup_codespace_wsl.sh scripts/create-product-devspace.sh
          node --check tools/vscode-gar/extension.js
          node --test tools/vscode-gar/*.test.js

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GAR runtime dependencies
        run: python -m pip install -r requirements-gar.txt

      - name: Run unittest
        run: python -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GAR runtime dependencies
        run: python -m pip install -r requirements-gar.txt

      - name: Import CLI and render Windows command help
        shell: pwsh
        run: |
          python -m scripts.gar_lib --help
          python -m scripts.gar_lib target --help
          cmd /c scripts\gar.cmd setup
          cmd /c scripts\gar.cmd --help
          python -m unittest discover -s tests -p test_gar_windows_host.py -v
          python -m unittest discover -s tests -p test_gar_uuu.py -v
